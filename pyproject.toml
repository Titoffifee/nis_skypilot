[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skypilot-bench"
version = "0.1.0"
requires-python = ">=3.10"
description = "Local SkyPilot capacity experiments"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skypilot_bench = ["patches/*.patch"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
